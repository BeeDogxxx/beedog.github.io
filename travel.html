    <nav class="navbar">
        <div class="container">

    <section class="page-header">
        <div class="container">
            <h1 class="page-title">🗺 我去过的地方</h1>
            <p class="page-subtitle">WORLD MAP · 关卡地图</p>
        </div>
    </section>

    <section style="padding: 40px 0 100px;">
        <div class="container">
            <div class="map-stage">
                <div class="map-tabs">
                    <button class="map-tab active" data-map="cn">🇨🇳 中国</button>
                    <button class="map-tab" data-map="world">🌏 世界</button>
                </div>

                <!-- 中国地图 -->
                <div class="map-canvas" id="mapCN">
                    <svg viewBox="0 0 800 450" preserveAspectRatio="none" style="position:absolute;inset:0;width:100%;height:100%;">
                        <!-- 像素风中国大陆轮廓(简化) -->
                        <g class="map-land">
                            <!-- 用粗糙像素块拼中国大致形状 -->
                            <rect x="200" y="90"  width="60" height="40"/>
                            <rect x="250" y="80"  width="80" height="40"/>
                            <rect x="320" y="80"  width="90" height="50"/>
                            <rect x="400" y="90"  width="80" height="50"/>
                            <rect x="470" y="100" width="90" height="60"/>
                            <rect x="180" y="120" width="80" height="50"/>
                            <rect x="250" y="120" width="120" height="60"/>
                            <rect x="360" y="120" width="140" height="70"/>
                            <rect x="490" y="150" width="100" height="60"/>
                            <rect x="560" y="140" width="40" height="30"/>
                            <rect x="150" y="160" width="90" height="70"/>
                            <rect x="230" y="170" width="140" height="80"/>
                            <rect x="360" y="180" width="150" height="90"/>
                            <rect x="500" y="200" width="80" height="60"/>
                            <rect x="170" y="220" width="100" height="90"/>
                            <rect x="260" y="240" width="130" height="80"/>
                            <rect x="380" y="260" width="130" height="70"/>
                            <rect x="500" y="260" width="50" height="40"/>
                            <rect x="230" y="310" width="100" height="50"/>
                            <rect x="320" y="320" width="120" height="50"/>
                            <rect x="440" y="320" width="60" height="40"/>
                            <!-- 海南岛 -->
                            <rect x="410" y="380" width="30" height="25"/>
                            <!-- 台湾 -->
                            <rect x="555" y="290" width="18" height="30"/>
                        </g>
                        <!-- 水面像素波纹 -->
                        <g fill="rgba(127,200,230,0.2)">
                            <rect x="580" y="250" width="200" height="6"/>
                            <rect x="600" y="270" width="180" height="6"/>
                            <rect x="620" y="290" width="160" height="6"/>
                        </g>
                    </svg>
                    <!-- 城市节点（相对 % 定位） -->
                    <div class="map-pin visited" style="left:71%;top:40%" data-city="hangzhou" data-year="2021-至今" data-note="大学四年 + 工作，蹲过西湖、走过钱塘江、吃过无数笋干烧肉" data-tag="常驻">
                        <div class="pin-dot"></div><div class="pin-label">杭州</div>
                    </div>
                    <div class="map-pin visited" style="left:60%;top:30%" data-city="beijing" data-year="2024" data-note="新加坡夏天去北京反而更凉快。烤鸭是真的好吃，胡同比想象中大很多" data-tag="去过">
                        <div class="pin-dot"></div><div class="pin-label">北京</div>
                    </div>
                    <div class="map-pin visited" style="left:70%;top:43%" data-city="shanghai" data-year="—" data-note="出差或周末过去逛一圈，永远在排队，永远在走路" data-tag="去过">
                        <div class="pin-dot"></div><div class="pin-label">上海</div>
                    </div>
                    <div class="map-pin visited" style="left:52%;top:42%" data-city="wuhan" data-year="—" data-note="热干面 + 过早文化 + 长江大桥" data-tag="路过">
                        <div class="pin-dot"></div><div class="pin-label">武汉</div>
                    </div>
                    <div class="map-pin visited" style="left:72%;top:52%" data-city="xiamen" data-year="—" data-note="鼓浪屿人挤人但海风真的值" data-tag="去过">
                        <div class="pin-dot"></div><div class="pin-label">厦门</div>
                    </div>
                    <div class="map-pin current" style="left:72%;top:41%" data-city="now" data-year="2026" data-note="★ 现在所在地" data-tag="当前">
                        <div class="pin-dot"></div><div class="pin-label">★ YOU</div>
                    </div>
                </div>

                <!-- 世界地图 -->
                <div class="map-canvas hidden" id="mapWorld">
                    <svg viewBox="0 0 800 450" preserveAspectRatio="none" style="position:absolute;inset:0;width:100%;height:100%;">
                        <g class="map-land">
                            <!-- 北美 -->
                            <rect x="60" y="80" width="140" height="100"/>
                            <rect x="100" y="170" width="100" height="60"/>
                            <rect x="130" y="225" width="60" height="40"/>
                            <!-- 南美 -->
                            <rect x="170" y="250" width="70" height="50"/>
                            <rect x="180" y="295" width="50" height="70"/>
                            <!-- 欧洲 -->
                            <rect x="370" y="90" width="80" height="50"/>
                            <rect x="380" y="135" width="60" height="40"/>
                            <!-- 非洲 -->
                            <rect x="370" y="180" width="80" height="80"/>
                            <rect x="390" y="255" width="60" height="70"/>
                            <!-- 亚洲 -->
                            <rect x="450" y="70" width="180" height="120"/>
                            <rect x="580" y="180" width="50" height="40"/>
                            <rect x="500" y="190" width="60" height="40"/>
                            <!-- 东南亚/澳洲 -->
                            <rect x="600" y="260" width="90" height="60"/>
                            <rect x="630" y="300" width="40" height="30"/>
                        </g>
                    </svg>
                    <div class="map-pin visited" style="left:72%;top:38%" data-city="cn-home" data-year="—" data-note="主基地 · 中国" data-tag="常驻">
                        <div class="pin-dot"></div><div class="pin-label">CN HOME</div>
                    </div>
                    <div class="map-pin" style="left:18%;top:28%; opacity:.5" data-city="locked-na" data-year="—" data-note="还没去 · 待解锁" data-tag="LOCKED">
                        <div class="pin-dot" style="background:#555;box-shadow:none"></div><div class="pin-label">LOCKED · 北美</div>
                    </div>
                    <div class="map-pin" style="left:50%;top:25%; opacity:.5" data-city="locked-eu" data-year="—" data-note="还没去 · 待解锁" data-tag="LOCKED">
                        <div class="pin-dot" style="background:#555;box-shadow:none"></div><div class="pin-label">LOCKED · 欧洲</div>
                    </div>
                </div>

                <!-- 对话框 -->
                <div class="map-detail" id="mapDetail">
                    <div class="md-title" id="mdTitle">▶ 点击地图上的光点</div>
                    <div class="md-meta" id="mdMeta">SELECT A STAGE</div>
                    <div class="md-body md-placeholder" id="mdBody">
                        每一个亮点都是一个解锁的关卡。点开看看我在那里的故事。
                    </div>
                </div>

                <!-- 统计 -->
                <div class="travel-stats">
                    <div class="ts"><div class="ts-num" id="tsCities">5</div><div class="ts-lbl">已点亮城市</div></div>
                    <div class="ts"><div class="ts-num">1</div><div class="ts-lbl">主基地</div></div>
                    <div class="ts"><div class="ts-num">7</div><div class="ts-lbl">省份</div></div>
                    <div class="ts"><div class="ts-num">∞</div><div class="ts-lbl">待解锁</div></div>
                </div>
            </div>
        </div>
    </section>

    <footer class="footer">
        <div class="container">
            <div class="footer-content">
                <div class="footer-brand"><span class="brand-icon">🐝</span><span class="brand-text">BeeDog</span></div>
                <p class="footer-description">蜜蜂狗BeeDog的说明书</p>
                <p class="footer-copyright">© 2025 苏笔辉</p>
            </div>
        </div>
    </footer>

    <button class="secret-star" id="secretStar" aria-label="神秘星星">✦</button>
    <div class="toast" id="toast"></div>

    <script src="js/main.js"></script>
    <script src="js/effects.js"></script>
    <script>
    // 切换地图
    document.querySelectorAll('.map-tab').forEach(tab => {
        tab.addEventListener('click', () => {
            document.querySelectorAll('.map-tab').forEach(t => t.classList.remove('active'));
            tab.classList.add('active');
            const map = tab.dataset.map;
            document.getElementById('mapCN').classList.toggle('hidden', map !== 'cn');
            document.getElementById('mapWorld').classList.toggle('hidden', map !== 'world');
        });
    });
    // 点击节点
    document.querySelectorAll('.map-pin').forEach(pin => {
        pin.addEventListener('click', () => {
            const title = pin.querySelector('.pin-label').textContent;
            const note = pin.dataset.note || '—';
            const year = pin.dataset.year || '';
            const tag = pin.dataset.tag || '';
            document.getElementById('mdTitle').innerHTML = '▶ ' + title;
            document.getElementById('mdMeta').textContent = `[${tag}] · ${year}`;
            const body = document.getElementById('mdBody');
            body.classList.remove('md-placeholder');
            body.textContent = note;
        });
    });
    </script>
</body>
</html>
